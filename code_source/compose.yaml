services:
  ecommerce:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: ecommerce_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_JWT_SECRET_BASE64=${APP_JWT_SECRET_BASE64}
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD}
    networks:
      - net_app
    depends_on:
      - postgres_db

  postgres_db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - my_data:/var/lib/postgresql
    networks:
      - net_app

volumes:
  my_data:

networks:
  net_app:
