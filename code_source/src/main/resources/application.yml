server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: ecommerce-monolith
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
app:
  jwt:
    issuer: ${APP_JWT_ISSUER:ecommerce-monolith}
    secret-base64: ${APP_JWT_SECRET_BASE64}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}
  bootstrap:
    admin-email: ${APP_ADMIN_EMAIL:}
    admin-password: ${APP_ADMIN_PASSWORD:}
  seed:
    products:
      enabled: ${APP_SEED_PRODUCTS_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ecommerce-monolith
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
logging:
  structured:
    format:
      console: ecs
