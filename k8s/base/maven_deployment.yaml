apiVersion: apps/v1
kind: Deployment
metadata:
  name: maven-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: maven-app
  template:
    metadata:
      labels:
        app: maven-app
    spec:
      containers:
      - name: maven-app
        image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/project/maven:v1.0.0
        imagePullPolicy: IfNotPresent

        env:
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: kube-secret
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kube-secret
                key: DB_PASSWORD
          - name: APP_JWT_SECRET_BASE64
            valueFrom:
              secretKeyRef:
                name: kube-secret
                key: APP_JWT_SECRET_BASE64

        # Inject All Keys at Once (envFrom)
        envFrom:
          - configMapRef:
              name: maven-configmap

        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 5

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 5

        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          failureThreshold: 30
          timeoutSeconds: 2
          periodSeconds: 10

        ports:
        - containerPort: 8080
