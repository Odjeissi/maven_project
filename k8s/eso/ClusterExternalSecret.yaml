apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: maven-cluster-externalsecret
spec:
  # Name of the ExternalSecret created in matching namespaces
  externalSecretName: maven-secrets

  # Select namespaces that have the label app=cloud-app
  namespaceSelectors:
    - matchLabels:
        app: maven-app

  externalSecretSpec:
    refreshInterval: 1h
    refreshPolicy: Periodic

    secretStoreRef:
      name: maven-cluster-secretstore
      kind: ClusterSecretStore

    target:
      name: kube-secret
      creationPolicy: Owner

    dataFrom:
      - extract:
          key: kube-secret
