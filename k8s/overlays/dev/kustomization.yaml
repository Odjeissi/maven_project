apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
  - name: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/project/maven
    newTag: 6e3f101c
labels:
  - pairs:
      app: maven-app # change this
    includeSelectors: false # set this to false, so it adds only metadata:label
namePrefix: dev-
namespace: dev
resources:
  - ../../base
patches:
  - path: config.yaml
