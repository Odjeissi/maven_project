apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: maven-monitor
  namespace: monitoring  # the manifest has to be in the same namespace as the prometheus stack
  labels:
    release: kube-prometheus-stack # <-- Must match your Prometheus serviceMonitorSelector
spec:
  namespaceSelector:    # look in this namespace
    matchNames:
      - dev
  selector:
    matchLabels:
      app: maven-app
  endpoints:
    - port: maven-service # <-- Matches the port name in your Service
      path: /actuator/prometheus
      interval: 15s
